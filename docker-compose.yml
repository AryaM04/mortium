# Production stack for a home server.
# Start it with: docker compose up -d
# Fill in the .env file first (see .env.example and docs/deploy.md).
# For development, use infra/docker-compose.dev.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Each service runs as a user without root rights where the image allows it,
# with no Linux capabilities, and it cannot get new rights. See
# docs/security-review.md.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:${NO_NEW_PRIVILEGES:-true}

services:
  # Reverse proxy. It serves the web app and sends /api and /gateway to the
  # api service. PROXY_MODE in .env selects the file with the mode settings
  # (ports, certificate): infra/proxy/direct.yml or
  # infra/proxy/cloudflare-tunnel.yml.
  caddy:
    extends:
      file: infra/proxy/${PROXY_MODE:-direct}.yml
      service: caddy
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mortium-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      TLS_MODE: ${TLS_MODE:-}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-26214400}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Caddy runs as user 10001 (see apps/web/Dockerfile). This lets it open
    # ports 80 and 443 without a capability. Docker 20.10 and later set this
    # value by default.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]
    mem_limit: 128m
    cpus: 1.0
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: mortium-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # These values come from DOMAIN and the fixed service names. Do not set them in .env.
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      TRUST_PROXY: "true"
      DATA_DIR: /data
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: https://${DOMAIN}
      PUBLIC_API_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DESKTOP_URL_SCHEME: ${DESKTOP_URL_SCHEME:-mortium}
      TURN_SECRET: ${TURN_SECRET}
      TURN_DOMAIN: ${DOMAIN}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST:-}
      TURN_TLS_PORT: "5349"
      TURN_TLS_ENABLED: ${TURN_TLS_ENABLED:-false}
      VOICE_AUDIO_BITRATE_KBPS: ${VOICE_AUDIO_BITRATE_KBPS:-128}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      RELEASES_REPO: ${RELEASES_REPO-AryaM04/mortium}
      ALLOW_PLAINTEXT_EVENTS: ${ALLOW_PLAINTEXT_EVENTS:-false}
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-26214400}
      ATTACHMENT_QUOTA_BYTES: ${ATTACHMENT_QUOTA_BYTES:-2147483648}
    volumes:
      - api-data:/data
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    networks: [internal]
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  # The database is reachable only from the internal network. It has no published port.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # The "postgres" user of the image (ID 70). It owns the data folder.
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    <<: *hardening
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  # TURN server. It uses the host network, so that the relay port range
  # needs no port mapping. This works on Linux only. Docker Desktop (Windows
  # and macOS) does not give a container the real host network, so use
  # Docker Desktop for development only.
  # The TLS certificate comes from the Caddy volume. infra/coturn/start.sh
  # finds it, and it makes coturn read the certificate again after Caddy
  # renews it (about every 60 days).
  coturn:
    image: coturn/coturn:4.7-alpine
    restart: unless-stopped
    network_mode: host
    init: true
    # The same user ID as Caddy, so that coturn can read the private key
    # that Caddy writes. The key file can be read only by its owner.
    user: "10001:10001"
    entrypoint: ["/bin/sh", "/usr/local/bin/start-coturn.sh"]
    command:
      - "--realm=${DOMAIN}"
      - "--listening-port=${TURN_PORT:-3478}"
      - "--min-port=${TURN_RELAY_MIN_PORT:-40000}"
      - "--max-port=${TURN_RELAY_MAX_PORT:-40099}"
    # start.sh writes the secret into a file. It is then not on the command line.
    environment:
      DOMAIN: ${DOMAIN}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
    volumes:
      - ./infra/coturn/turnserver.prod.conf:/etc/coturn/turnserver.conf:ro
      - ./infra/coturn/start.sh:/usr/local/bin/start-coturn.sh:ro
      - caddy-data:/caddy-data:ro
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    # The turnserver file has this capability. Without it in the bounding
    # set, the kernel does not start the file. coturn does not use it: the
    # ports are above 1024, and the process has no active capabilities.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 1.0
    logging: *logging

  # Nightly backup of the database and the data files. See docs/deploy.md.
  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    image: mortium-backup
    restart: unless-stopped
    command: ["loop"]
    depends_on:
      postgres:
        condition: service_healthy
    # The same user as the api service, so that it can read and restore /data.
    # This user must be able to write to BACKUP_DIR (see docs/deploy.md).
    user: "100:101"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - api-data:/data
      - ${BACKUP_DIR:-./backups}:/backup
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

  # Optional DDNS updater for Cloudflare. Start it with: docker compose --profile ddns up -d
  ddns:
    profiles: [ddns]
    image: favonia/cloudflare-ddns:1
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    <<: *hardening
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      DOMAINS: ${DOMAIN}
      PROXIED: "false"
      IP6_PROVIDER: none
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

  # Optional DDNS updater for DuckDNS. Start it with: docker compose --profile ddns-duckdns up -d
  ddns-duckdns:
    profiles: [ddns-duckdns]
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    # This image starts as root and then changes to its own user. It needs
    # the default capabilities for that, so only "no-new-privileges" is set.
    security_opt:
      - no-new-privileges:${NO_NEW_PRIVILEGES:-true}
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
      - duckdns-config:/config
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

networks:
  internal:

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  api-data:
  duckdns-config:
