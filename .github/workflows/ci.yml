name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mortium
          POSTGRES_PASSWORD: mortium
          POSTGRES_DB: mortium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mortium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mortium:mortium@localhost:5432/postgres
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Separate job: the Rust tests of the WASM crypto wrapper. rustup reads
  # the pinned toolchain from rust-toolchain.toml in the crate folder.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/crypto-wasm
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Cache the Cargo registry and the build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/crypto-wasm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/crypto-wasm/rust-toolchain.toml', 'packages/crypto-wasm/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Test
        run: cargo test --locked

  # Separate job: the Rust tests of the desktop app (address checks of the
  # link preview fetch, server address, deep links). It runs on Windows,
  # the main desktop target, so it needs no Linux webview packages.
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-tauri/src-tauri
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Cache the Cargo registry and the build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri -> target

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add a stub web build
        # The Tauri build step needs the web build folder. The tests do not
        # use its content, so a stub page is enough.
        run: |
          mkdir -p ../../web/dist
          echo "<!doctype html><title>stub</title>" > ../../web/dist/index.html

      - name: Test
        run: cargo test --locked

  # Separate job: browser tests that need a real TURN server. It does
  # not run in the "build" job above, since it needs Docker Compose and
  # a real Chromium engine, and it is slower than a unit test run.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mortium
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: mortium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mortium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @mortium/e2e exec playwright install --with-deps chromium

      - name: Copy the environment file
        # On Linux, 127.0.0.1 in the container is not the host. Coturn must
        # announce the host IP, so that relay packets go back through Docker.
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          cp .env.example .env
          sed -i "s/^TURN_EXTERNAL_IP=.*/TURN_EXTERNAL_IP=$HOST_IP/" .env
          echo "TURN_TEST_HOST=$HOST_IP" >> "$GITHUB_ENV"

      - name: Start coturn
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml up -d coturn

      - name: Run the end-to-end tests
        run: pnpm e2e

      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
          retention-days: 7

      - name: Show the coturn log
        if: failure()
        run: |
          grep TURN_EXTERNAL_IP .env
          docker compose --env-file .env -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml logs coturn | tail -n 80

      - name: Stop coturn
        if: always()
        run: docker compose --env-file .env -f infra/docker-compose.dev.yml -f infra/docker-compose.ci.yml down

  # Separate job: the production coturn service of docker-compose.yml, with
  # the production config, on the Linux host network. Two browser peers must
  # connect through the relay only, and the relay must refuse private peer
  # addresses.
  turn-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --filter @mortium/e2e exec playwright install --with-deps chromium

      - name: Make the environment file
        # The relay uses the host IP address. The runner has no router, so the
        # host IP is also the external IP.
        run: |
          HOST_IP=$(hostname -I | awk '{print $1}')
          node scripts/generate-secrets.mjs
          sed -i \
            -e "s/^DOMAIN=.*/DOMAIN=turn.example.com/" \
            -e "s/^ACME_EMAIL=.*/ACME_EMAIL=admin@example.com/" \
            -e "s/^TURN_EXTERNAL_IP=.*/TURN_EXTERNAL_IP=$HOST_IP/" .env
          echo "TURN_TEST_HOST=$HOST_IP" >> "$GITHUB_ENV"

      - name: Start the production coturn
        run: docker compose up -d coturn

      - name: Run the TURN tests
        env:
          TURN_EXPECT_PROD_RULES: "true"
          TURN_TEST_REQUIRED: "true"
        run: pnpm --filter @mortium/e2e exec playwright test webrtc-turn turn-peer-rules

      - name: Show the coturn log
        if: failure()
        run: docker compose logs coturn | tail -n 80

      - name: Stop coturn
        if: always()
        run: docker compose down -v

  # Separate job: build the Linux desktop app (Electron), install its deb
  # package and run a smoke test under xvfb against a test API server. See
  # "Build, test and release the Linux app" in docs/concepts/desktop-shells.md.
  electron:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mortium
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: mortium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mortium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Read the Node version from .nvmrc
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Cache the Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool gnome-keyring dbus-x11

      - name: Build the deb package
        working-directory: apps/desktop-electron
        run: |
          pnpm --filter @mortium/web build
          node build.mjs
          pnpm exec electron-builder --linux deb --publish never

      - name: Install the deb package
        run: sudo apt-get install -y ./apps/desktop-electron/release/*.deb

      - name: Start the API server
        # The server must allow the origin of the Linux app.
        run: |
          cp .env.example .env
          echo "CORS_ALLOWED_ORIGINS=app://mortium" >> .env
          cd apps/server
          nohup pnpm exec tsx --env-file=../../.env src/index.ts > ../../server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:3000/api/v1/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ../../server.log
          exit 1

      - name: Run the smoke test with a key ring
        # GNOME Keyring gives safeStorage a real key ring. XDG_CURRENT_DESKTOP
        # tells Chromium to use it.
        env:
          XDG_CURRENT_DESKTOP: GNOME
          XDG_CONFIG_HOME: ${{ runner.temp }}/config-key-ring
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci-password" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run -a -s "-screen 0 1280x800x24" node apps/desktop-electron/scripts/smoke.mjs /opt/mortium/mortium http://localhost:3000
          '

      - name: Run the smoke test without a key ring
        env:
          SMOKE_EXPECT_NO_KEY_RING: "1"
          XDG_CONFIG_HOME: ${{ runner.temp }}/config-no-key-ring
        run: xvfb-run -a node apps/desktop-electron/scripts/smoke.mjs /opt/mortium/mortium http://localhost:3000

      - name: Show the API server log
        if: failure()
        run: tail -n 80 server.log

  # Separate job: build the production images and check the production
  # compose file. It does not push the images.
  production-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Make a test environment file
        run: |
          node scripts/generate-secrets.mjs
          {
            echo "DOMAIN=chat.example.com"
            echo "ACME_EMAIL=admin@example.com"
            echo "TURN_EXTERNAL_IP=203.0.113.7"
            echo "SMTP_HOST=smtp.example.com"
          } >> .env

      - name: Check the compose file
        run: docker compose --profile ddns --profile ddns-duckdns config --quiet

      - name: Build the images
        run: docker compose build

      - name: Show the image sizes
        run: docker images --format '{{.Repository}} {{.Size}}' | grep mortium
